<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del empleado</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Detalle del empleado</h1>
        <a href="/empleados/" class="btn btn-secondary">
            Volver
        </a>
    </div>

    <div id="mensaje"></div>

    <div id="empleado" class="card shadow-sm">
        <div class="card-body">
            <p class="text-muted">Cargando información...</p>
        </div>
    </div>

</div>

<script>

const empleadoId = "{{ empleado_id }}";
let empleadoActual = null;

async function cargarEmpleado() {

    try {

        const response = await fetch(`/api/empleados/${empleadoId}/`);

        if (!response.ok) {
            throw new Error("No se pudo obtener el empleado.");
        }

        empleadoActual = await response.json();

        document.getElementById("empleado").innerHTML = `
            <div class="card-body">

                <h3 class="card-title mb-4">
                    ${empleadoActual.nombre} ${empleadoActual.apellido}
                </h3>

                <p>
                    <strong>ID:</strong> ${empleadoActual.id}
                </p>

                <p>
                    <strong>Documento:</strong> ${empleadoActual.documento}
                </p>

                <p>
                    <strong>Correo:</strong> ${empleadoActual.correo}
                </p>

                <p>
                    <strong>Teléfono:</strong> ${empleadoActual.telefono}
                </p>
                <div class="mt-4">
                    <button class="btn btn-primary" onclick="mostrarFormulario()">
                        Editar empleado
                    </button>
                </div>

                <div class="mt-2">
                    <button class="btn btn-danger" onclick="eliminarEmpleado()">
                        Eliminar empleado
                    </button>
                </div>

            </div>
        `;

    } catch (error) {

        document.getElementById("mensaje").innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;

    }
}

cargarEmpleado();

function mostrarFormulario() {

    document.getElementById("empleado").innerHTML = `
        <div class="card-body">

            <h3 class="card-title mb-4">
                Editar empleado
            </h3>

            <form onsubmit="actualizarEmpleado(event)">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        class="form-control"
                        value="${empleadoActual.nombre}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Apellido</label>
                    <input
                        type="text"
                        id="apellido"
                        class="form-control"
                        value="${empleadoActual.apellido}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Documento</label>
                    <input
                        type="text"
                        id="documento"
                        class="form-control"
                        value="${empleadoActual.documento}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input
                        type="email"
                        id="correo"
                        class="form-control"
                        value="${empleadoActual.correo}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input
                        type="text"
                        id="telefono"
                        class="form-control"
                        value="${empleadoActual.telefono}"
                        required
                    >
                </div>

                <button
                    type="button"
                    class="btn btn-warning"
                    onclick="actualizarEmpleado()">
                    Guardar cambios
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="cargarEmpleado()"
                >
                    Cancelar
                </button>



            </form>

        </div>
    `;
}

async function actualizarEmpleado(event) {

    event.preventDefault();

    const datosActualizados = {
        nombre: document.getElementById("nombre").value,
        apellido: document.getElementById("apellido").value,
        documento: document.getElementById("documento").value,
        correo: document.getElementById("correo").value,
        telefono: document.getElementById("telefono").value
    };

    try {

        const response = await fetch(`/api/empleados/${empleadoId}/`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datosActualizados)
        });

        const resultado = await response.json();

        if (!response.ok) {
            throw new Error(resultado.error || "No se pudo actualizar el empleado.");
        }

        document.getElementById("mensaje").innerHTML = `
            <div class="alert alert-success">
                ${resultado.mensaje}
            </div>
        `;

        cargarEmpleado();

    } catch (error) {

        document.getElementById("mensaje").innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;
    }
}

async function eliminarEmpleado() {

    const confirmar = confirm(
        "¿Realmente desea eliminar el registro?"
    );

    if (!confirmar) {
        return;
    }

    try {

    const response = await fetch(`/api/empleados/${empleadoId}/`, {
        method: "DELETE"
    });

    const resultado = await response.json();

    if (!response.ok) {
        throw new Error(
            resultado.error || "No se pudo eliminar el empleado."
        );
    }

    document.getElementById("mensaje").innerHTML = `
        <div class="alert alert-success">
            ${resultado.mensaje}
        </div>
    `;

    setTimeout(() => {
        window.location.href = "/empleados/";
    }, 1000);

    } catch (error) {

        document.getElementById("mensaje").innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;

    }
}

async function actualizarEmpleado() {

    const datos = {
        nombre: document.getElementById("nombre").value,
        apellido: document.getElementById("apellido").value,
        documento: document.getElementById("documento").value,
        correo: document.getElementById("correo").value,
        telefono: document.getElementById("telefono").value
    };

    const response = await fetch(
        `/api/empleados/${empleadoId}/`,
        {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        }
    );

    const resultado = await response.json();

    if (!response.ok) {
        console.error(resultado);
        alert("No fue posible actualizar el empleado.");
        return;
    }

    alert("Empleado actualizado correctamente.");

    window.location.href = "/empleados/";
}

</script>

</body>
</html>
