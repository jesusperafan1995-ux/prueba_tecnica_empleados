<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del empleado</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Detalle del empleado</h1>
        <a href="/empleados/" class="btn btn-secondary">
            Volver
        </a>
    </div>

    <div id="mensaje"></div>

    <div id="empleado" class="card shadow-sm">
        <div class="card-body">
            <p class="text-muted">Cargando información...</p>
        </div>
    </div>

</div>

<script>

const empleadoId = "{{ empleado_id }}";

async function cargarEmpleado() {

    try {

        const response = await fetch(`/api/empleados/${empleadoId}/`);

        if (!response.ok) {
            throw new Error("No se pudo obtener el empleado.");
        }

        const empleado = await response.json();

        document.getElementById("empleado").innerHTML = `
            <div class="card-body">

                <h3 class="card-title mb-4">
                    ${empleado.nombre} ${empleado.apellido}
                </h3>

                <p>
                    <strong>ID:</strong> ${empleado.id}
                </p>

                <p>
                    <strong>Documento:</strong> ${empleado.documento}
                </p>

                <p>
                    <strong>Correo:</strong> ${empleado.correo}
                </p>

                <p>
                    <strong>Teléfono:</strong> ${empleado.telefono}
                </p>

            </div>
        `;

    } catch (error) {

        document.getElementById("mensaje").innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;

    }
}

cargarEmpleado();

</script>

</body>
</html>
