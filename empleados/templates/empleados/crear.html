<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo empleado</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Nuevo empleado</h1>

        <a href="/empleados/" class="btn btn-secondary">
            Volver
        </a>
    </div>

    <div id="mensaje"></div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form id="form-empleado">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre</label>
                        <input
                            type="text"
                            id="nombre"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellido</label>
                        <input
                            type="text"
                            id="apellido"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Documento</label>
                        <input
                            type="text"
                            id="documento"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Correo</label>
                        <input
                            type="email"
                            id="correo"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input
                            type="text"
                            id="telefono"
                            class="form-control"
                            required
                        >
                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Guardar empleado
                </button>

            </form>

        </div>

    </div>

</div>


<script>

document.getElementById("form-empleado").addEventListener("submit", async function(event) {

    event.preventDefault();

    const mensaje = document.getElementById("mensaje");

    const empleado = {
        nombre: document.getElementById("nombre").value,
        apellido: document.getElementById("apellido").value,
        documento: document.getElementById("documento").value,
        correo: document.getElementById("correo").value,
        telefono: document.getElementById("telefono").value
    };

    try {

        const response = await fetch("/api/empleados/crear/", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(empleado)

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "No se pudo crear el empleado.");
        }

        mensaje.innerHTML = `
            <div class="alert alert-success">
                Empleado creado correctamente.
            </div>
        `;

        document.getElementById("form-empleado").reset();

        setTimeout(() => {
            window.location.href = "/empleados/";
        }, 1000);

    } catch (error) {

        mensaje.innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;

    }

});

</script>

</body>
</html>
